<script type="module">
import * as THREE from 'three';
import { softenFurniture } from './formas_organicas.js';
import { daylightEnvironment,finishMaterial,softenBox,windowLighting,roomMirrors,realismStats } from './realismo.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- Configuracion ----------
const FT = 0.3048;          // Revit exporta el FBX en pies y con Z hacia arriba
const EYE = 1.65;           // altura de ojos en metros

// ---------- Renderizador ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;   // CASA V5: algo mas de luz para que el crema se vea como en Revit
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.08, 2000);
function fitCameraToScreen() {
  camera.aspect = innerWidth / innerHeight;
  // en vertical el campo horizontal es angosto: el recorrido abre mas la vista
  camera.fov = innerHeight > innerWidth ? (window.__touring ? 92 : 78) : (window.__touring ? 62 : 55);
  camera.updateProjectionMatrix();
}
fitCameraToScreen();

// ---------- Cielo, sol y luz ambiente ----------
const sky = new Sky();
sky.scale.setScalar(5000);
scene.add(sky);
const su = sky.material.uniforms;
su.turbidity.value = 3.5; su.rayleigh.value = 1.4; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.85;

const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.012;
sun.shadow.radius=3;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xfff1de, 0xc4a98a, 0.5);   // luz ambiente calida (antes azulada)
scene.add(hemi);

const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
const hdrEnvironment=await daylightEnvironment(renderer,pmrem);
let updateWindowLights=()=>{}; let updateMirrors=()=>{};
let currentHour=10;
const sunDir = new THREE.Vector3();
const center = new THREE.Vector3();
let radius = 10, floorY = 0, lawnY = -2;
let lamps = [];             // luces de lampara del mobiliario

function setHour(h) {
  currentHour=h;
  // Trayectoria solar simplificada. El sol sale por la esquina noroeste del modelo (-X, -Z)
  // y se pone por la sureste. SUN_TURN gira toda la trayectoria: 0 = sale por +X, 135 = sale por el noroeste.
  const SUN_TURN = 135;
  const t = (h - 6) / 12, k = Math.sin(t * Math.PI);
  const elev = k * 66 + 3, azim = THREE.MathUtils.lerp(100, -100, t) + SUN_TURN;
  sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elev), THREE.MathUtils.degToRad(azim));
  su.sunPosition.value.copy(sunDir);
  sun.color.setRGB(1, 0.95 - (1 - k) * 0.28, 0.86 - (1 - k) * 0.5);
  sun.intensity = .75 + k * 1.75;
  hemi.intensity = .12 + k * .25;
  sun.position.copy(center).addScaledVector(sunDir, radius * 4);
  sun.target.position.copy(center);
  renderer.shadowMap.needsUpdate = true;
  const dusk = h <= 7.25 || h >= 16.75;        // lamparas encendidas solo con el sol bajo
  lamps.forEach(l => { l.visible = dusk; });
  if(hdrEnvironment) scene.environment=hdrEnvironment.texture;
  else {
    if (envRT) envRT.dispose();
    const s2 = new THREE.Scene(); s2.add(sky.clone());
    envRT = pmrem.fromScene(s2, 0, 0.1, 6000);scene.environment = envRT.texture;
  }
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  document.getElementById('hourOut').textContent = hh + ':' + String(mm).padStart(2, '0');
}

// ---------- Texturas procedurales ----------
// Las coordenadas UV se generan en metros (ver boxUV), asi que repeat = 1 / tamano de la baldosa
function tex(size, tileMeters, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / tileMeters, 1 / tileMeters);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.userData.canvas = c;
  return t;
}
// Relieve: el mismo dibujo de la textura se usa como mapa de relieve (juntas y vetas quedan hundidas)
function relief(t) {
  const b = new THREE.CanvasTexture(t.userData.canvas);
  b.wrapS = b.wrapT = THREE.RepeatWrapping; b.repeat.copy(t.repeat); b.anisotropy = 8;
  return b;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function speckle(g, s, n, fn) { for (let i = 0; i < n; i++) { g.fillStyle = fn(); g.fillRect(Math.random() * s, Math.random() * s, rnd(1, 3), rnd(1, 3)); } }

const T = {
  grass: tex(512, 3, (g, s) => {
    g.fillStyle = '#5b7f35'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 30000; i++) { g.fillStyle = `hsl(${rnd(82, 112)},${rnd(42, 68)}%,${rnd(28, 48)}%)`; g.fillRect(Math.random() * s, Math.random() * s, 1.5, rnd(2, 6)); }
  }),
  earth: tex(256, 2, (g, s) => { g.fillStyle = '#5b4632'; g.fillRect(0, 0, s, s); speckle(g, s, 9000, () => `hsl(${rnd(22, 34)},${rnd(22, 38)}%,${rnd(18, 34)}%)`); }),
  plaster: tex(1024, 2.5, (g, s) => {
    g.fillStyle = '#e6e2d8'; g.fillRect(0, 0, s, s);
    // manchas suaves de llana + grano fino de estuco
    for (let i = 0; i < 260; i++) { const x = Math.random() * s, y = Math.random() * s, r = rnd(20, 90); const gr = g.createRadialGradient(x, y, 0, x, y, r); const c = Math.random() < .5 ? '255,255,255' : '150,142,128'; gr.addColorStop(0, `rgba(${c},${rnd(.03, .08)})`); gr.addColorStop(1, `rgba(${c},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
    speckle(g, s, 60000, () => `rgba(${Math.random() < .5 ? '255,255,255' : '110,102,90'},${rnd(.03, .11)})`);
  }),
  concrete: tex(512, 3, (g, s) => { g.fillStyle = '#a9a8a3'; g.fillRect(0, 0, s, s); speckle(g, s, 22000, () => `rgba(${Math.random() < .5 ? '255,255,255' : '40,40,40'},${rnd(.03, .12)})`); g.strokeStyle = 'rgba(60,60,60,.25)'; g.lineWidth = 2; g.strokeRect(0, 0, s, s); }),
  wood: tex(1024, 2.4, (g, s) => {
    const rows = 12, h = s / rows;
    for (let r = 0; r < rows; r++) {
      let x = -rnd(0, s * .5);
      while (x < s) {
        const w = rnd(s * .35, s * .6);
        g.fillStyle = `hsl(${rnd(25, 30)},${rnd(44, 52)}%,${rnd(40, 47)}%)`; g.fillRect(x, r * h, w, h);
        for (let i = 0; i < 26; i++) { g.strokeStyle = `rgba(60,30,10,${rnd(.04, .14)})`; g.lineWidth = rnd(.5, 1.5); const y = r * h + rnd(2, h - 2); g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + w * .3, y + rnd(-3, 3), x + w * .6, y + rnd(-3, 3), x + w, y); g.stroke(); }
        g.fillStyle = 'rgba(30,15,5,.55)'; g.fillRect(x + w - 1.5, r * h, 1.5, h);
        x += w;
      }
      g.fillStyle = 'rgba(30,15,5,.55)'; g.fillRect(0, r * h, s, 1.5);
    }
  }),
  shingle: tex(512, 1.6, (g, s) => {
    const rows = 8, h = s / rows, cols = 6, w = s / cols;
    for (let r = 0; r < rows; r++) for (let c = -1; c < cols; c++) {
      const x = c * w + (r % 2 ? w / 2 : 0);
      g.fillStyle = `hsl(${rnd(18, 28)},${rnd(18, 30)}%,${rnd(24, 36)}%)`; g.fillRect(x, r * h, w, h);
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x, r * h, 2, h); g.fillRect(x, r * h + h - 3, w, 3);
      g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(x, r * h, w, 2);
    }
    speckle(g, s, 9000, () => `rgba(0,0,0,${rnd(.04, .14)})`);
  }),
  // Lamina metalica de junta alzada: el color lo pone el material; aqui solo van juntas y brillo
  lamina: tex(512, 0.45, (g, s) => {
    g.fillStyle = '#e9e9e9'; g.fillRect(0, 0, s, s);
    const gr = g.createLinearGradient(0, 0, s, 0); gr.addColorStop(0, 'rgba(0,0,0,.16)'); gr.addColorStop(0.5, 'rgba(255,255,255,.1)'); gr.addColorStop(1, 'rgba(0,0,0,.16)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, 7, s); g.fillRect(s - 7, 0, 7, s);          // sombra de la junta
    g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(7, 0, 5, s);                                 // lomo de la junta
    for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(0,0,0,${rnd(.02, .06)})`; g.fillRect(rnd(0, s), 0, rnd(1, 3), s); }   // escurridos
  }),
  tile: tex(512, 1.2, (g, s) => {
    g.fillStyle = '#b9bbbb'; g.fillRect(0, 0, s, s); speckle(g, s, 8000, () => `rgba(255,255,255,${rnd(.03, .1)})`);
    g.strokeStyle = 'rgba(70,70,70,.6)'; g.lineWidth = 3; for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * s / 2, 0); g.lineTo(i * s / 2, s); g.moveTo(0, i * s / 2); g.lineTo(s, i * s / 2); g.stroke(); }
  })
};

// ---------- Biblioteca de materiales PBR ----------
const S = (o) => new THREE.MeshStandardMaterial(o);
const P = (o) => new THREE.MeshPhysicalMaterial(o);
const M = {
  plaster: S({ map: T.plaster, roughness: 0.92, bumpMap: relief(T.plaster), bumpScale: 0.6 }),
  soffit: S({ color: 0xe9e6df, roughness: 0.9 }),
  shingle: S({ map: T.shingle, roughness: 0.95, bumpMap: relief(T.shingle), bumpScale: 3 }),
  grass: S({ map: T.grass, roughness: 1, bumpMap: relief(T.grass), bumpScale: 2 }),
  earth: S({ map: T.earth, roughness: 1 }),
  concrete: S({ map: T.concrete, roughness: 0.85, bumpMap: relief(T.concrete), bumpScale: 0.8 }),
  column: S({ map: T.plaster, color: 0xf2efe8, roughness: 0.88, bumpMap: relief(T.plaster), bumpScale: 0.6 }),
  wood: S({ map: T.wood, roughness: 0.38, bumpMap: relief(T.wood), bumpScale: 1.2 }),
  tile: S({ map: T.tile, roughness: 0.16, bumpMap: relief(T.tile), bumpScale: 1.5 }),
  doorWood: S({ color: 0x7a4a26, roughness: 0.5 }),
  frame: S({ color: 0x5b3a1e, roughness: 0.5 }),
  frameWhite: S({ color: 0xece9e2, roughness: 0.6 }),
  metal: S({ color: 0x2a2c2f, roughness: 0.4, metalness: 0.85 }),
  chrome: S({ color: 0xd9dde0, roughness: 0.12, metalness: 1 }),
  glass: P({ color: 0xd4e8ee, roughness: 0.02, metalness: 0, transparent: true, opacity: 0.2, envMapIntensity: 1.8, side: THREE.DoubleSide, depthWrite: false }),
  carPaint: P({ color: 0x1d4b86, roughness: 0.3, metalness: 0.5, clearcoat: 1, clearcoatRoughness: 0.05 }),   // azul metalizado
  carRim: S({ color: 0x3b3e43, roughness: 0.3, metalness: 0.85 }),
  carHead: P({ color: 0xf4f6f8, roughness: 0.05, metalness: 0.4, emissive: 0x9a9890, envMapIntensity: 2 }),
  carGlass: P({ color: 0x0b1014, roughness: 0.04, metalness: 0.2, envMapIntensity: 2, clearcoat: 1 }),
  carDark: S({ color: 0x18191b, roughness: 0.7 }),
  carSeat: S({ color: 0x6f7074, roughness: 0.9 }),
  retaining: S({ map: T.concrete, color: 0xb8b4aa, roughness: 0.95 }),
  rubber: S({ color: 0x0c0c0d, roughness: 0.95 }),
  carRed: S({ color: 0x9a0d0d, roughness: 0.25, emissive: 0x2a0000 }),
  carLight: P({ color: 0xffffff, roughness: 0.05, metalness: 0.3, envMapIntensity: 2 }),
  fallback: S({ color: 0xcfccc4, roughness: 0.85 })
};
M.glass.userData.ghost = true;   // el suelo no "choca" con el vidrio

// ---------- Pintura de muros y propuestas de techo ----------
// Cada cara de muro se pinta segun hacia donde mira: interior, exterior o muro de acento.
const paint = (color) => S({ map: T.plaster, color, roughness: 0.9, bumpMap: M.plaster.bumpMap, bumpScale: 0.6 });
M.wallInt = paint(0xf6f1e7);
M.wallExt = paint(0xffffff);
M.acc = [paint(0xffffff), paint(0xffffff), paint(0xffffff), paint(0xffffff)];
const reliefLamina = relief(T.lamina), reliefShingle = M.shingle.bumpMap;

// Zonas interiores [x0, x1, z0, z1] a ejes de muros (las mismas del cielo raso)
const ZONES = [[141.17, 145.77, 112.34, 120.85], [145.77, 147.35, 112.34, 120.06], [147.35, 152.51, 109.08, 123.06], [144.74, 147.35, 111.74, 112.34], [145.85, 147.35, 109.08, 111.74]];   // CASA V6 (ejes de muros)
// Muros de acento: zona donde cae un punto a 20 cm delante de la cara
const ACCENTS = [];   // CASA V5: sin muros de acento definidos
const inRect = (r, x, z) => x > r[0] && x < r[1] && z > r[2] && z < r[3];
function wallClass(x, z) {
  for (let i = 0; i < ACCENTS.length; i++) if (inRect(ACCENTS[i], x, z)) return 2 + i;
  for (const r of ZONES) if (inRect(r, x, z)) return 0;
  return 1;
}
// Reparte los triangulos de cada muro por clase. split = true crea una malla por clase (para poder fundirlas).
function paintWalls(root, filter, split) {
  const list = [];
  root.traverse(o => { if (o.isMesh && o.visible && filter(o)) list.push(o); });
  const mats = [M.wallInt, M.wallExt, ...M.acc];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  for (const o of list) {
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    const P = geo.attributes.position, N = geo.attributes.normal, U = geo.attributes.uv;
    if (!N || !U) continue;
    const tri = P.count / 3, cls = new Uint8Array(tri);
    for (let t = 0; t < tri; t++) {
      a.fromBufferAttribute(P, t * 3).applyMatrix4(o.matrixWorld);
      b.fromBufferAttribute(P, t * 3 + 1).applyMatrix4(o.matrixWorld);
      c.fromBufferAttribute(P, t * 3 + 2).applyMatrix4(o.matrixWorld);
      n.subVectors(b, a).cross(c.clone().sub(a));
      const h = Math.hypot(n.x, n.z);
      if (h < 1e-9 || Math.abs(n.y) > h) { cls[t] = 0; continue; }           // cara horizontal
      cls[t] = wallClass((a.x + b.x + c.x) / 3 + n.x / h * 0.2, (a.z + b.z + c.z) / 3 + n.z / h * 0.2);
    }
    const order = Array.from({ length: tri }, (_, i) => i).sort((i, j) => cls[i] - cls[j]);
    const np = new Float32Array(tri * 9), nn = new Float32Array(tri * 9), nu = new Float32Array(tri * 6);
    order.forEach((t, k) => {
      for (let v = 0; v < 3; v++) {
        const s = t * 3 + v, d = k * 3 + v;
        np[d * 3] = P.getX(s); np[d * 3 + 1] = P.getY(s); np[d * 3 + 2] = P.getZ(s);
        nn[d * 3] = N.getX(s); nn[d * 3 + 1] = N.getY(s); nn[d * 3 + 2] = N.getZ(s);
        nu[d * 2] = U.getX(s); nu[d * 2 + 1] = U.getY(s);
      }
    });
    const ranges = [];                                  // [clase, primer triangulo, cantidad]
    for (let k = 0; k < tri;) { const cl = cls[order[k]]; let e = k; while (e < tri && cls[order[e]] === cl) e++; ranges.push([cl, k, e - k]); k = e; }
    const make = (from, count) => {
      const g2 = new THREE.BufferGeometry();

let tourFrozen = false;   // solo para pruebas: deja la camara quieta en un punto
window.__tourIr = (name, quieto = false, n = 1) => { let t = 0; for (const e of TOUR_LINE) { if (e.kind === 'move' && e.pts[e.k + 1].name === name && --n === 0) { tourFrozen = false; tourTime = t + e.dur * 0.9; tourSnap = true; updateTour(0); tourFrozen = quieto; return name; } t += e.dur; } return null; };

// ---------- Bucle ----------
const ray = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmp = new THREE.Vector3();
function solid(h) {
  const m = h.object.material;
  const mat = Array.isArray(m) ? m[h.face ? h.face.materialIndex : 0] : m;
  return !(mat && mat.userData.ghost);
}
function tick() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05);   // el recorrido usa el tiempo real (rawDt): igual de rapido en celulares lentos
  if (window.__ready) {
    if (mode === 'tour') {
      updateTour(Math.min(rawDt, 0.5));
    } else {
      const sp = (keys.ShiftLeft || keys.ShiftRight ? 3.5 : 1.4) * dt;
      fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw)); right.set(Math.cos(yaw), 0, -Math.sin(yaw));
      tmp.set(0, 0, 0);
      if (keys.KeyW || keys.ArrowUp) tmp.add(fwd);
      if (keys.KeyS || keys.ArrowDown) tmp.sub(fwd);
      if (keys.KeyD || keys.ArrowRight) tmp.add(right);
      if (keys.KeyA || keys.ArrowLeft) tmp.sub(right);
      if (mobileMoveY) tmp.addScaledVector(fwd, -mobileMoveY);
      if (mobileMoveX) tmp.addScaledVector(right, mobileMoveX);
      if (tmp.lengthSq() > 0) camera.position.addScaledVector(tmp.normalize(), sp);
      if (walk) {
        // Seguir el suelo: rayo hacia abajo desde la altura de la cabeza
        ray.set(tmp.copy(camera.position).setY(camera.position.y + 0.2), DOWN); ray.far = 40;
        const hit = ray.intersectObjects(walkingFloors, false).find(solid);
        const target = (hit ? hit.point.y : lawnY) + EYE;
        camera.position.y += (target - camera.position.y) * Math.min(1, dt * 8);
      } else {
        if (keys.KeyE) camera.position.y += sp;
        if (keys.KeyQ) camera.position.y -= sp;
      }
    }
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  }
  if(window.__ready){updateWindowLights(camera,currentHour);updateMirrors(camera,hq);}
  if (composer && hq) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- Oclusion ambiental (sombras de contacto en esquinas y bajo los muebles) ----------
// Si el navegador o la tarjeta grafica no lo soportan, el recorrido sigue funcionando sin este efecto.
// Cuesta rendimiento, asi que arranca apagado en tarjetas graficas integradas; el boton "Calidad alta" lo cambia.
let composer = null, hq = true;
{
  const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
  if (/Intel|UHD|Iris|Radeon\(TM\) Graphics|SwiftShader|llvmpipe/i.test(gpu) || matchMedia('(pointer:coarse)').matches || innerWidth < 700) hq = false;
  if(localStorage.getItem('cv3-quality'))hq=localStorage.getItem('cv3-quality')==='high';

  const bQ = document.getElementById('bQ');
  bQ.classList.toggle('on', hq); bQ.setAttribute('aria-pressed',String(hq));
  bQ.onclick = () => { hq = !hq;localStorage.setItem('cv3-quality',hq?'high':'light'); bQ.classList.toggle('on', hq); bQ.setAttribute('aria-pressed',String(hq)); };
}
(async () => {
  try {
    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { GTAOPass } = await import('three/addons/postprocessing/GTAOPass.js');
    const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
    const c = new EffectComposer(renderer);
    c.renderTarget1.samples = 4; c.renderTarget2.samples = 4;     // suavizado de bordes
    c.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    ao.updateGtaoMaterial({ radius: 0.3, distanceExponent: 1.5, thickness: .35, scale: 1.0, samples: 12 });
    ao.blendIntensity = 0.55;
    c.addPass(ao);
    c.addPass(new OutputPass());
    composer = c;
    window.__ao = ao; window.__composer = c;
  } catch (e) { console.warn('Oclusion ambiental no disponible:', e); }
})();
tick();

addEventListener('resize', () => {
  fitCameraToScreen();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>
